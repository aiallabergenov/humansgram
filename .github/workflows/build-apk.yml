name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Backup our code
        run: |
          mkdir -p /tmp/backup
          cp lib/main.dart /tmp/backup/main.dart || true
          cp -r assets /tmp/backup/ || true
          ls -la /tmp/backup/
      - name: Create fresh Flutter project
        run: |
          rm -rf android ios web linux macos windows
          flutter create . --project-name humansgram --org com.humansgram.app --platforms android
      - name: Restore our Humansgram code
        run: |
          cp /tmp/backup/main.dart lib/main.dart
          rm -rf assets
          cp -r /tmp/backup/assets assets || true
          ls lib/ assets/
      - name: Add dependencies
        run: |
          flutter pub add supabase_flutter
          flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: humansgram-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
